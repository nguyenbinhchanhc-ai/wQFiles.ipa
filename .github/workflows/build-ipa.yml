name: Build WQFiles IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          sysctl -n hw.ncpu

      - name: Run tests and build WQFiles.ipa
        env:
          WQ_TEST_TIMEOUT: "120"
        run: |
          set -o pipefail
          chmod +x build.sh tests/*.sh
          bash build.sh 2>&1 | tee /tmp/wq-build.log

      - name: Publish failure log for diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          cp /tmp/wq-build.log /tmp/ci-logs/build.log || true
          find .work/tests -name '*.log' -exec cp {} /tmp/ci-logs/ \; 2>/dev/null || true
          cd /tmp/ci-logs
          git init -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CI failure logs for ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin ci-logs

      - name: Upload WQFiles.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-ipa
          path: WQFiles.ipa
          if-no-files-found: error

      - name: Publish WQFiles.ipa Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.9.20-optimized"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" WQFiles.ipa \
            --title "WQFiles 0.9.20 (Optimized)" \
            --notes "Built from commit ${{ github.sha }} on macOS 26 with all host & iOS syntax/link checks passing."
